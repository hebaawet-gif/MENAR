
workflows:
  menar_android:
    name: MENAR Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Extract MENAR project
        script: |
          unzip -o MENAR_v1_0-2.zip -d menar_source
          PROJECT_FILE=$(find menar_source -name pubspec.yaml -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Flutter project not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
